<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="iconBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131f"/>
      <stop offset="50%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Blade Gradients -->
    <linearGradient id="bladeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="bladeCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="bladeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Frame -->
  <rect width="512" height="512" rx="112" fill="url(#iconBaseGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect width="512" height="512" rx="112" fill="url(#iconBgGlow)"/>

  <!-- Centered Technical Geometry -->
  <g transform="translate(256, 256)">
    <!-- Ambient Halo -->
    <circle cx="0" cy="0" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#coreGlow)"/>

    <!-- Precision Rings -->
    <circle cx="0" cy="0" r="170" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.6"/>
    <circle cx="0" cy="0" r="145" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    
    <!-- Reticle Ticks -->
    <line x1="0" y1="-175" x2="0" y2="-155" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="155" x2="0" y2="175" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="-175" y1="0" x2="-155" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="155" y1="0" x2="175" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>

    <!-- Prismatic "N" -->
    <!-- Left Pillar -->
    <path d="M -90 100 L -90 -80 C -90 -91 -81 -100 -70 -100 L -50 -100 C -39 -100 -30 -91 -30 -80 L -30 100 C -30 111 -39 120 -50 120 L -70 120 C -81 120 -90 111 -90 100 Z"
          fill="url(#bladeLeft)"/>

    <!-- Right Pillar -->
    <path d="M 30 100 L 30 -80 C 30 -91 39 -100 50 -100 L 70 -100 C 81 -100 90 -91 90 -80 L 90 100 C 90 111 81 120 70 120 L 50 120 C 39 120 30 111 30 100 Z"
          fill="url(#bladeRight)"/>

    <!-- Diagonal Traverse -->
    <path d="M -75 -84 L 70 85 C 78 95 72 108 59 108 L 32 108 C 24 108 17 103 12 96 L -75 2 Z"
          fill="url(#bladeCenter)" opacity="0.95"/>

    <!-- Core Nova Flare Spark -->
    <g transform="translate(0, 0)" filter="url(#sparkGlow)">
      <path d="M 0 -44 L 6 -8 L 42 0 L 6 8 L 0 44 L -6 8 L -42 0 L -6 -8 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    </g>
  </g>
</svg>
