<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="iconBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131f"/>
      <stop offset="50%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Clean Geometric Monogram Gradients -->
    <linearGradient id="iconLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="iconDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="iconRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Frame -->
  <rect width="512" height="512" rx="112" fill="url(#iconBaseGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect width="512" height="512" rx="112" fill="url(#iconBgGlow)"/>

  <!-- Centered Technical Geometry -->
  <g transform="translate(256, 256)">
    <!-- Ambient Halo -->
    <circle cx="0" cy="0" r="160" fill="#38bdf8" fill-opacity="0.08" filter="url(#coreGlow)"/>

    <!-- Precision Concentric Rings -->
    <circle cx="0" cy="0" r="172" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.6"/>
    <circle cx="0" cy="0" r="148" stroke="#1e293b" stroke-width="2" opacity="0.9"/>
    
    <!-- Reticle Ticks -->
    <line x1="0" y1="-178" x2="0" y2="-158" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="158" x2="0" y2="178" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="-178" y1="0" x2="-158" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <line x1="158" y1="0" x2="178" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>

    <!-- Geometric "N" Monogram -->
    <!-- Left Vertical Column -->
    <rect x="-92" y="-105" width="50" height="210" rx="14" fill="url(#iconLeft)"/>

    <!-- Right Vertical Column -->
    <rect x="42" y="-105" width="50" height="210" rx="14" fill="url(#iconRight)"/>

    <!-- Diagonal Traverse (Smooth Precision Blade) -->
    <path d="M -92 -92 C -92 -99 -85 -105 -77 -105 L -45 -105 C -38 -105 -31 -101 -28 -95 L 77 92 C 81 99 76 108 67 108 L 35 108 C 28 108 21 104 18 98 L -87 -89 C -90 -94 -92 -98 -92 -92 Z"
          fill="url(#iconDiag)"/>
  </g>
</svg>
