<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="40" y1="60" x2="860" y2="60" />
    <line x1="40" y1="120" x2="860" y2="120" />
    <line x1="40" y1="180" x2="860" y2="180" />
    <line x1="160" y1="20" x2="160" y2="220" />
    <line x1="360" y1="20" x2="360" y2="220" />
    <line x1="560" y1="20" x2="560" y2="220" />
    <line x1="760" y1="20" x2="760" y2="220" />
  </g>

  <!-- Telemetry Pulse Waveform in Background -->
  <path d="M 40 140 L 120 140 L 140 110 L 160 170 L 180 120 L 200 140 L 280 140 L 300 90 L 320 180 L 340 130 L 360 140 L 860 140"
        fill="none" stroke="url(#pulseGrad)" stroke-width="2.5" />

  <!-- Logo Icon Container -->
  <g transform="translate(60, 48)">
    <!-- Outer Hexagon / Shield -->
    <rect x="0" y="0" width="144" height="144" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect x="6" y="6" width="132" height="132" rx="24" fill="#090d16" opacity="0.8"/>
    
    <!-- Orbital Rings -->
    <circle cx="72" cy="72" r="48" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5" />
    <circle cx="72" cy="72" r="32" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>

    <!-- Pulse Line in Icon -->
    <path d="M 24 72 L 48 72 L 60 44 L 76 100 L 88 62 L 96 72 L 120 72"
          fill="none" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Core Spark / Glowing Node -->
    <circle cx="76" cy="100" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="60" cy="44" r="3" fill="#34d399"/>
  </g>

  <!-- Typography & Branding -->
  <g transform="translate(240, 75)">
    <!-- Main Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="900" letter-spacing="4" fill="url(#glowGrad)">NOVA<tspan fill="#f8fafc">MONITOR</tspan></text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="3" fill="#94a3b8">PROFESSIONAL SYSTEM TELEMETRY SUITE</text>

    <!-- Badges / Tags -->
    <g transform="translate(2, 92)">
      <!-- Delphi / Free Pascal Badge -->
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="60" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">DELPHI &amp; FPC</text>

      <!-- MVVM Badge -->
      <rect x="130" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="175" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">MVVM / VCL</text>

      <!-- High-DPI Badge -->
      <rect x="230" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="287" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">HIGH-DPI PER-MON</text>

      <!-- Win64 Native Badge -->
      <rect x="355" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="402" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#facc15" text-anchor="middle">WIN64 NATIVE</text>
    </g>
  </g>
</svg>
